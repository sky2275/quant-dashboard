name: 量化复盘看板自动更新

on:
  schedule:
    # 固定更新时间（北京时间 → UTC，标准时 UTC+8）。GitHub Actions cron 最小粒度为分钟，秒级 05 无法实现，已按 09:25 / 14:30 分钟级触发。
    # 注：Actions 定时任务平台有 0~15 分钟抖动延迟，无法精确到秒。
    - cron: "0 0 * * *"    # 08:00 北京时间（UTC 00:00）美股隔夜
    - cron: "25 1 * * *"   # 09:25 北京时间（UTC 01:25）盘前
    - cron: "30 2 * * *"   # 10:30 北京时间（UTC 02:30）早盘
    - cron: "0 4 * * *"    # 12:00 北京时间（UTC 04:00）午盘
    - cron: "30 6 * * *"   # 14:30 北京时间（UTC 06:30）尾盘进攻
    - cron: "0 8 * * *"    # 16:00 北京时间（UTC 08:00）收盘复盘
  workflow_dispatch:         # 允许手动触发
  push:
    branches: [main]
    paths:                   # 代码/配置更新时自动重建看板
      - "scripts/**"
      - "config/**"
      - ".github/workflows/update_dashboard.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install akshare pandas pyyaml tushare requests
      - name: 拉取行情数据
        run: python scripts/feed.py
      - name: 美股→A股传导预测(08:00)
        run: python scripts/us_overnight.py
      - name: 生成看板
        run: python scripts/build_dashboard.py
      - name: 提交更新
        run: |
          git config user.name "quant-bot"
          git config user.email "bot@quant.local"
          git add index.html cache/*.json
          git commit -m "auto update dashboard $(date +'%Y-%m-%d %H:%M')" || echo "no changes"
          git push
