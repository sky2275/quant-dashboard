# ============================================================
# 券商交割单 → 标准字段 列名映射
# 你只改这个文件：把你导出的 CSV 实际列名填到对应位置即可，
# 不用碰代码。拿到样例后若列名不同，只改这里。
# ------------------------------------------------------------
# 标准字段含义：
#   date   成交日期
#   code   证券代码（6位，如 600000 / 300750）
#   name   证券名称（中文，如 浦发银行）
#   side   买卖方向（含"买"→买入，含"卖"→卖出）
#   qty    成交数量（股）
#   price  成交价格（元/股）
#   amount 成交金额（元，price 缺失时用于反算均价）
#   fees   费用列名列表（佣金/印花税/过户费等，求和计入成本）
# ============================================================

brokers:
  galaxy:    # 银河证券 交割单导出
    encoding: "gbk"          # 银河导出多为 GBK；识别失败会自动尝试 utf-8/gb18030
    date: "成交日期"
    code: "证券代码"
    name: "证券名称"
    side: "买卖标志"
    qty: "成交数量"
    price: "成交价格"
    amount: "成交金额"
    fees: ["佣金", "印花税", "过户费", "清算费"]
    buy_keywords: ["买入", "买", "B", "BUY"]
    sell_keywords: ["卖出", "卖", "S", "SELL"]

  eastmoney: # 东方财富证券 交割单导出
    encoding: "utf-8-sig"    # 东财导出多为 UTF-8(BOM)
    date: "日期"
    code: "股票代码"
    name: "股票名称"
    side: "交易方向"
    qty: "成交量"
    price: "成交均价"
    amount: "成交金额"
    fees: ["手续费", "印花税", "过户费"]
    buy_keywords: ["买入", "买", "B", "BUY"]
    sell_keywords: ["卖出", "卖", "S", "SELL"]
