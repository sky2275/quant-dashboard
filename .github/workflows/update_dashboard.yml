name: 量化复盘看板自动更新

on:
  schedule:
    # 固定更新时间（北京时间 → UTC，标准时 UTC+8）。仅周一至周五触发，运行时再判断是否为交易日。
    # 注：Actions 定时任务平台有 0~15 分钟抖动延迟，无法精确到秒。
    - cron: "0 0 * * 1-5"    # 08:00  开盘前/美股隔夜传导
    - cron: "26 1 * * 1-5"   # 09:26  集合竞价扫描
    - cron: "30 2 * * 1-5"   # 10:30  早盘刷新
    - cron: "0 4 * * 1-5"    # 12:00  午盘刷新
    - cron: "30 6 * * 1-5"   # 14:30  市场情绪扫描
    - cron: "0 14 * * 1-5"   # 22:00  美股收盘/隔夜复盘
  workflow_dispatch:         # 允许手动触发
  push:
    branches: [main]
    paths:                   # 代码/配置/数据/产物更新时自动重建看板
      - "scripts/**"
      - "config/**"
      - "data/statements/**"   # 放入两家券商交割单 CSV 也触发重建
      - "cache/**"             # 持仓/行情缓存变更（含手动更新 holdings.json）触发重建
      - "index.html"           # 看板产物变更触发重建
      - ".github/workflows/update_dashboard.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install akshare pandas pyyaml tushare requests openpyxl xlrd
      - name: 检查是否为交易日
        id: trade_check
        run: |
          python - <<'PY'
          from scripts.feed import get_trade_context
          ctx = get_trade_context()
          print(f"today={ctx['today']}, trade_date={ctx['trade_date']}, is_trade_day={ctx['is_trade_day']}")
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"is_trade_day={str(ctx['is_trade_day']).lower()}\n")
          PY
      - name: 拉取行情数据
        if: github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true'
        run: python scripts/feed.py
      - name: 美股→A股传导预测(08:00)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '0 0 * * 1-5'
        run: python scripts/us_overnight.py
      - name: 扫描全A股-集合竞价(09:26)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '26 1 * * 1-5'
        run: python scripts/scan_a_shares.py --mode 0926
      - name: 扫描全A股-早盘趋势(10:30)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '30 2 * * 1-5'
        run: python scripts/scan_a_shares.py --mode 1030
      - name: 扫描全A股-午盘趋势(12:00)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '0 4 * * 1-5'
        run: python scripts/scan_a_shares.py --mode 1200
      - name: 扫描全A股-市场情绪(14:30)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '30 6 * * 1-5'
        run: python scripts/scan_a_shares.py --mode 1430
      - name: 扫描全A股-盘后复盘(22:00)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '0 14 * * 1-5'
        run: python scripts/scan_a_shares.py --mode 2200
      - name: A股盘后复盘总结(22:00)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '0 14 * * 1-5'
        run: python scripts/daily_review.py
      - name: 获取回测用K线数据
        if: github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true'
        run: python scripts/fetch_backtest_klines.py
      - name: 生成看板（含三仓策略系统）
        if: github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true'
        run: python scripts/build_full.py
      - name: 提交更新
        run: |
          git config user.name "quant-bot"
          git config user.email "bot@quant.local"
          git add index.html cache/*.json
          git commit -m "auto update dashboard $(date +'%Y-%m-%d %H:%M')" || echo "no changes"
          # 与本地定时刷新(刷新脚本也会推送)并发时优雅合并，避免推送被拒
          git pull --rebase || true
          git checkout --ours index.html cache/*.json 2>/dev/null || true
          git add index.html cache/*.json
          git commit --amend --no-edit 2>/dev/null || true
          git push
