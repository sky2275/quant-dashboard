# 美股 → A股 板块传导映射
# us_drivers: 监控的美股代码（akshare 代码，如 NVDA/AMD/MU）
# a_candidates: 对应 A股候选标的（用于传导预测展示）
# threshold: 美股加权涨跌超过该百分比(绝对值) 触发“强”信号
sector_mapping:
  - a_sector: "半导体"
    us_drivers: ["NVDA", "AMD", "TSM", "AVGO", "INTC"]
    a_candidates: ["通富微电", "华天科技", "中微公司", "中芯国际", "北方华创"]
    threshold: 2.0
  - a_sector: "存储芯片"
    us_drivers: ["MU", "WDC", "STX"]
    a_candidates: ["兆易创新", "深科技", "澜起科技", "北京君正", "江波龙"]
    threshold: 2.0
  - a_sector: "光模块"
    us_drivers: ["COHR", "LITE", "AAOI", "NPTN", "CIEN"]
    a_candidates: ["中际旭创", "天孚通信", "新易盛", "光迅科技", "剑桥科技"]
    threshold: 2.0
  - a_sector: "物理AI/机器人"
    us_drivers: ["SYM", "ISRG", "TER", "TSLA", "ROK"]
    a_candidates: ["埃斯顿", "汇川技术", "绿的谐波", "三花智控", "拓普集团"]
    threshold: 1.5
  - a_sector: "科技巨头"
    us_drivers: ["AAPL", "MSFT", "META", "GOOGL", "AMZN"]
    a_candidates: ["中芯国际", "海光信息", "寒武纪", "韦尔股份", "北方华创"]
    threshold: 1.5
  - a_sector: "苹果供应链"
    us_drivers: ["AAPL", "QCOM", "SWKS", "CRUS", "LITE"]
    a_candidates: ["立讯精密", "蓝思科技", "歌尔股份", "领益智造", "鹏鼎控股"]
    threshold: 1.5

