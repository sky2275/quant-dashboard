name: 量化复盘看板更新（手动触发）

on:
  workflow_dispatch:         # 仅手动触发：Actions → 选择此工作流 → Run workflow
    inputs:
      rebuild:
        description: '重新拉取行情并重建看板（含三仓策略系统）'
        required: false
        default: 'true'
      push_cache:
        description: '同时提交 cache/*.json 变更'
        required: false
        default: 'true'

# 说明（2026-08-06 改为手动模式，用户决定停掉 bot 自动更新）：
# - 已删除 schedule 定时（08:00/09:26/10:30/12:00/14:30/22:00）
# - 已删除 push 触发：避免 push 后自动重建覆盖人工定制的 index.html / cache
# - 手动触发后：拉行情 → 重建看板 → 部署 Pages → 自动提交（commit 带 [bot-deploy-skip]）

# 部署 GitHub Pages 需要 pages: write 与 id-token: write；
# 提交数据更新需要 contents: write
permissions:
  contents: write
  pages: write
  id-token: write

# 串行部署，避免多次并发触发互相覆盖
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 防止机器人自身提交触发的无限循环：仅当提交信息不含 [bot-deploy-skip] 时才构建
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[bot-deploy-skip]')
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install akshare pandas pyyaml tushare requests openpyxl xlrd
      - name: 检查是否为交易日
        id: trade_check
        run: |
          python - <<'PY'
          from scripts.feed import get_trade_context
          ctx = get_trade_context()
          print(f"today={ctx['today']}, trade_date={ctx['trade_date']}, is_trade_day={ctx['is_trade_day']}")
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"is_trade_day={str(ctx['is_trade_day']).lower()}\n")
          PY
      - name: 拉取行情数据
        if: github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true'
        run: python scripts/feed.py
      - name: 美股→A股传导预测(08:00)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '0 0 * * 1-5'
        run: python scripts/us_overnight.py
      - name: 扫描全A股-集合竞价(09:26)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '26 1 * * 1-5'
        run: python scripts/scan_a_shares.py --mode 0926
      - name: 扫描全A股-早盘趋势(10:30)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '30 2 * * 1-5'
        run: python scripts/scan_a_shares.py --mode 1030
      - name: 扫描全A股-午盘趋势(12:00)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '0 4 * * 1-5'
        run: python scripts/scan_a_shares.py --mode 1200
      - name: 扫描全A股-市场情绪(14:30)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '30 6 * * 1-5'
        run: python scripts/scan_a_shares.py --mode 1430
      - name: 扫描全A股-盘后复盘(22:00)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '0 14 * * 1-5'
        run: python scripts/scan_a_shares.py --mode 2200
      - name: A股盘后复盘总结(22:00)
        if: (github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true') && github.event.schedule == '0 14 * * 1-5'
        run: python scripts/daily_review.py
      - name: 获取回测用K线数据
        if: github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true'
        run: python scripts/fetch_backtest_klines.py
      - name: 生成回测引擎数据(明日备选池+机构策略目录)
        if: github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true'
        run: python scripts/build_backtest_engine_data.py
      - name: 生成看板（含三仓策略系统）
        if: github.event_name != 'schedule' || steps.trade_check.outputs.is_trade_day == 'true'
        run: python scripts/build_full.py
      - name: 提交数据更新
        run: |
          git config user.name "quant-bot"
          git config user.email "bot@quant.local"
          git add index.html cache/*.json
          # 仅当有变更才提交；避免对无变化的产物反复重写历史
          if git commit -m "auto update dashboard $(date +'%Y-%m-%d %H:%M') [bot-deploy-skip]"; then
            # 与本地定时刷新(刷新脚本也会推送)并发时，最多重试 3 次：
            # 每次 rebase 后以本次生成的 index.html/cache 为准(--ours)，再推送。
            for i in 1 2 3; do
              git pull --rebase || git rebase --abort || true
              git checkout --ours index.html cache/*.json 2>/dev/null || true
              git add index.html cache/*.json
              if git push; then
                echo "pushed (attempt $i)"
                break
              fi
              echo "push rejected, retry $i"
              sleep 5
            done
          else
            echo "no changes to commit"
          fi
      - name: 准备部署产物
        run: |
          mkdir -p dist
          cp index.html dist/
          touch dist/.nojekyll
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 切换 Pages 源为 GitHub Actions 模式
        # 用 GITHUB_TOKEN（已授予 pages: write）调用 REST API，将部署方式切到 workflow。
        # 幂等：已为 workflow 模式时返回当前配置，不改变。
        run: |
          curl -L -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow","source":{"branch":"main","path":"/"}}'
          echo "Pages source switched to GitHub Actions (workflow)"
          sleep 10

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
